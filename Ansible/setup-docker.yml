---
- name: Install and Setup Docker along with Docker Compose V2 on EC2 Instances
  hosts: ec2_instances
  become: yes # Runs all tasks with sudo privileges
  tasks:

    - name: 1. Update apt package cache and upgrade system packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: 2. Install required prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
        state: present

    - name: 3. Ensure target directory for apt keyrings exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: 4. Download and dearmor Docker official GPG key safely
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg # Skips if file already exists

    - name: 5. Detect correct Ubuntu codename and add stable Docker repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.dir/docker.list > /dev/null
        # Using a separate file path fallback just in case:
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list

    - name: 6. Install Docker Engine and Docker Compose V2 plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin # This installs Docker Compose V2 (docker compose)
        state: present
        update_cache: yes # Forces apt update to read new repo config

    - name: 7. Ensure Docker service is started and enabled on boot
      service:
        name: docker
        state: started
        enabled: yes

    - name: 8. Add 'ubuntu' user to the docker group to avoid using sudo for docker commands
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: 9. Reset SSH connection to apply new docker group membership immediately
      meta: reset_connection