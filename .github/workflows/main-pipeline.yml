name: SKILLPULSE DevSecOps Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      cleanup:
        description: "Run Infra Cleanup Job"
        required: true
        default: "false"

jobs:

  code-stage:
    if: github.event_name != 'workflow_dispatch'
    name: CODE
    uses: sachinthokal/SkillPulse_App/.github/workflows/code-analysis.yml@main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-stage:
    if: github.event_name != 'workflow_dispatch'
    name: BUILD
    needs: code-stage
    uses: sachinthokal/SkillPulse_App/.github/workflows/ci.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  test-stage:
    if: github.event_name != 'workflow_dispatch'
    name: TEST
    needs: build-stage
    uses: sachinthokal/SkillPulse_App/.github/workflows/test.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build-infra:
    if: github.event_name != 'workflow_dispatch'
    name: BUILD-INFRA
    needs: test-stage
    uses: sachinthokal/SkillPulse_App/.github/workflows/terraform-kind-cluster.yml@main

  deploy-stage:
    if: github.event_name != 'workflow_dispatch'
    name: DEPLOY
    needs: build-infra
    uses: sachinthokal/SkillPulse_App/.github/workflows/deploy-argocd.yml@main

  deploy-prod:
    if: github.event_name != 'workflow_dispatch'
    name: DEPLOY
    needs: deploy-stage
    uses: sachinthokal/SkillPulse_App/.github/workflows/cd.yml@main
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      ENV_FILE: ${{ secrets.ENV_FILE }}

  infra-clean:
    if: github.event_name == 'workflow_dispatch'
    name: Delete Non-Prod Infra
    needs: build-infra
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Kind Cluster Check
        run: |
          cd ~/Sachin_Workspace/projects/SkillPulse_App/Terraform/local-kind-cluster/

          if kind get clusters | grep -q "^terraform-east-cluster$"; then
            echo "Cluster exists, deleting..."
            terraform destroy -auto-approve
          else
            echo "Cluster does not exist, Exited..."
          fi
          
          echo "Successfully Deleted KinD cluster using Terraform."