name: SKILLPULSE DevSecOps Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      cleanup:
        description: "Run Infra Cleanup Job"
        required: true
        default: "false"

jobs:
  code-stage:
    if: github.event_name != 'workflow_dispatch'
    name: CODE
    uses: sachinthokal/SkillPulse_App/.github/workflows/code-analysis.yml@main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-stage:
    if: github.event_name != 'workflow_dispatch'
    name: BUILD
    needs: code-stage
    uses: sachinthokal/SkillPulse_App/.github/workflows/ci.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  test-stage:
    if: github.event_name != 'workflow_dispatch'
    name: TEST
    needs: build-stage
    uses: sachinthokal/SkillPulse_App/.github/workflows/test.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build-infra:
    needs: test-stage
    if: github.event_name != 'workflow_dispatch'
    name: BUILD
    uses: sachinthokal/SkillPulse_App/.github/workflows/terraform-infra.yml@main

  deploy-stage:
    if: github.event_name != 'workflow_dispatch'
    name: DEPLOY
    needs: build-infra
    uses: sachinthokal/SkillPulse_App/.github/workflows/deploy-argocd.yml@main

  deploy-prod:
    if: github.event_name != 'workflow_dispatch'
    name: DEPLOY
    needs: deploy-stage
    uses: sachinthokal/SkillPulse_App/.github/workflows/cd.yml@main
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      ENV_FILE: ${{ secrets.ENV_FILE }}

  infra-clean:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.cleanup == 'true'
    name: Delete Non-Prod Infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Working Directory
        run: cd Terraform

      - name: Terraform Plan
        id: plan
        run: |
          terraform destroy

      - name: Terraform Output
        run: |
          terraform output >> $GITHUB_STEP_SUMMARY
          echo "Non-Prod Infra Deleted !!" >> $GITHUB_STEP_SUMMARY
