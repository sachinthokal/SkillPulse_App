name: SKILLPULSE DevSecOps Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      cleanup:
        description: "Run Infra Cleanup Job"
        required: true
        default: "false"

jobs:
  code-stage:
    if: github.event_name != 'workflow_dispatch'
    name: CODE
    uses: sachinthokal/SkillPulse_App/.github/workflows/code-analysis.yml@main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-stage:
    if: github.event_name != 'workflow_dispatch'
    name: BUILD
    needs: code-stage
    uses: sachinthokal/SkillPulse_App/.github/workflows/ci.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  test-stage:
    if: github.event_name != 'workflow_dispatch'
    name: TEST
    needs: build-stage
    uses: sachinthokal/SkillPulse_App/.github/workflows/test.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build-infra:
    needs: test-stage
    if: github.event_name != 'workflow_dispatch'
    name: BUILD
    uses: sachinthokal/SkillPulse_App/.github/workflows/terraform-infra.yml@main

  deploy-stage:
    if: github.event_name != 'workflow_dispatch'
    name: DEPLOY
    needs: build-infra
    uses: sachinthokal/SkillPulse_App/.github/workflows/deploy-argocd.yml@main

  deploy-prod:
    if: github.event_name != 'workflow_dispatch'
    name: DEPLOY
    needs: deploy-stage
    uses: sachinthokal/SkillPulse_App/.github/workflows/cd.yml@main
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      ENV_FILE: ${{ secrets.ENV_FILE }}

  infra-clean:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.cleanup == 'true'
    name: Delete Non-Prod Infra
    runs-on: self-hosted
    environment: Non Prod Infra Clean
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 1: Build
      - name: Download Terraform State File
        uses: actions/download-artifact@v4
        with:
          name: terraform-state-artifact
          path: ./Terraform

      # STEP 2: Destroy 
      - name: Terraform Destroy
        id: destroy
        working-directory: ./Terraform
        run: |
          echo "=== Initializing Terraform ==="
          terraform init
          
          echo "=== Starting Infrastructure Destruction ==="
          terraform destroy -auto-approve
          
          echo "### 🛑 Non-Prod Infra Deleted Successfully !!" >> $GITHUB_STEP_SUMMARY