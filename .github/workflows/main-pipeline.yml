name: Main DevSecOps Pipeline

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    # 1. CODE STAGE - Reusable workflow for code quality and security checks
    code_stage:
        name: Code Quality and Security Checks
        uses: ./.github/workflows/code-stage.yml
        with:
            sonar_project_key: "skillpulse-app" # sonar_project_key for SonarQube analysis
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # 2. BUILD STAGE - Build and push Docker images (depends on code_stage)
    build_stage:
        name: Build and Push Docker Images
        needs: code_stage
        uses: ./.github/workflows/ci.yml
        with:
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        secrets:
            DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. TEST STAGE - Placeholder for running tests (depends on build_stage)
    test_stage:
        name: Run Tests
        needs: build_stage
        runs-on: ubuntu-latest
        steps:
            - name: Placeholder for Running Tests
              run: echo "Build stage completed successfully. Ready for running tests!"

    # 4. Deploy Stage - Deploy to EC2 (depends on test_stage)
    deploy_stage:
        name: Deploy to EC2
        needs: test_stage
        uses: ./.github/workflows/cd.yml
        with:
            EC2_HOST: ${{ secrets.EC2_HOST }}
            EC2_USER: ${{ secrets.EC2_USER }}
        secrets:
            EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
            ENV_FILE: ${{ secrets.ENV_FILE }}

    # 5. Monitoring Stage - Placeholder for monitoring setup (depends on deploy_stage)
    monitoring_stage:
        name: Setup Monitoring
        needs: deploy_stage
        runs-on: ubuntu-latest
        steps:
            - name: Placeholder for Monitoring Setup
              run: echo "Deployment completed successfully. Ready for monitoring setup!"
