name: SKILLPULSE DevSecOps Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  code-stage:
    if: github.event_name != 'workflow_dispatch'
    name: CODE
    uses: sachinthokal/SkillPulse_App/.github/workflows/code-analysis.yml@main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-stage:
    if: github.event_name != 'workflow_dispatch'
    name: BUILD
    needs: code-stage
    uses: sachinthokal/SkillPulse_App/.github/workflows/ci.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  test-stage:
    if: github.event_name != 'workflow_dispatch'
    name: TEST
    needs: build-stage
    uses: sachinthokal/SkillPulse_App/.github/workflows/test.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy-non-prod:
    needs: test-stage
    if: github.event_name != 'workflow_dispatch'
    name: DEPLOY
    uses: sachinthokal/SkillPulse_App/.github/workflows/non-prod-infra.yml@main

  deploy-prod:
    if: github.event_name != 'workflow_dispatch'
    name: DEPLOY
    needs: deploy-non-prod
    uses: sachinthokal/SkillPulse_App/.github/workflows/cd.yml@main
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      ENV_FILE: ${{ secrets.ENV_FILE }}