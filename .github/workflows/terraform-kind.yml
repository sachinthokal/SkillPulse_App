name: "Terraform KinD on Local Machine"

on:
  workflow_dispatch: 

jobs:
  terraform:
    name: "Non-Prod Infra"
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Infra with Terraform
        run: |
        
         cd Terraform/local-kind-cluster
         echo "Initializing Terraform..."
          terraform init
          terraform plan -tfvar-file=terraform.tfvars
          terraform apply -auto-approve -tfvar-file=terraform.tfvars
         pwd