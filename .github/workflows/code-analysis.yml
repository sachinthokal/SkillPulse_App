name: SKILLPULSE SAST
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonarcloud-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Your authentication token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=sachinthokal
            -Dsonar.projectKey=sachinthokal_SkillPulse_App
            -Dsonar.sources=.
            -Dsonar.qualitygate.wait=true

      - name: Publish SonarCloud Report to UI
        if: always() # Ensure this step runs even if the previous one fails
        run: |
          echo "### [View SonarCloud Dashboard](https://sonarcloud.io/dashboard?id=sachinthokal_SkillPulse_App&branch=main)" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 SonarCloud Scan Results" >> $GITHUB_STEP_SUMMARY

  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}