name: SKILLPULSE TEST

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
        
jobs:
  test:
    name: Test And Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Trivy Backend Scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:latest
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
    
      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:latest
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'