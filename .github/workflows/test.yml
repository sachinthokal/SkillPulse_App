name: SKILLPULSE DAST

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  test:
    name: Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Trivy Backend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:latest
          format: "table"
          exit-code: "1"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-frontend:latest
          format: "table"
          exit-code: "1"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Publish Trivy Scan Results to UI
        if: always() # Ensure this step runs even if the previous ones fail
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          echo "### 🚀 Trivy Scan Results - Backend Image" >> $GITHUB_STEP_SUMMARY
          echo "#### Image: docker.io/$DOCKERHUB_USERNAME/skillpulse-backend:latest" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          trivy image --format table --severity CRITICAL,HIGH docker.io/$DOCKERHUB_USERNAME/skillpulse-backend:latest >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🚀 Trivy Scan Results - Frontend Image" >> $GITHUB_STEP_SUMMARY
          echo "#### Image: docker.io/$DOCKERHUB_USERNAME/skillpulse-frontend:latest" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          trivy image --format table --severity CRITICAL,HIGH docker.io/$DOCKERHUB_USERNAME/skillpulse-frontend:latest >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  cross-os-test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker on macOS (Colima)
        if: matrix.os == 'macos-latest'
        run: |
          brew install docker colima
          colima start --cpu 2 --memory 4
          echo "DOCKER_HOST=unix://$HOME/.colima/default/docker.sock" >> $GITHUB_ENV

      - name: Start Docker Daemon (Windows Only)
        if: matrix.os == 'windows-latest'
        run: |
          cd "C:\Program Files\Docker\Docker"
          ./DockerCli.exe -SwitchDaemon

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create Test Network
        run: docker network create skillpulse-test-net

      - name: Start Backend Container
        run: |
          docker pull $DOCKERHUB_USERNAME/skillpulse-backend:latest
          docker run -d --name skillpulse-backend-test --network skillpulse-test-net $DOCKERHUB_USERNAME/skillpulse-backend:latest

      - name: Wait for Backend to be Ready
        run: |
          ${{ matrix.os == 'windows-latest' && 'timeout /t 5 /nobreak' || 'sleep 5' }}

      - name: Test Connection via Curl
        run: |
          docker pull $DOCKERHUB_USERNAME/skillpulse-frontend:latest
          docker run --rm --network skillpulse-test-net $DOCKERHUB_USERNAME/skillpulse-frontend:latest curl -i http://skillpulse-backend-test:8080/health

      - name: Cleanup Containers
        if: always()
        run: |
          docker rm -f skillpulse-backend-test || true
          docker network rm skillpulse-test-net || true
